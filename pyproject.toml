[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "robot-ai"
version = "0.1.0"
description = "Adaptive control experiments for imperfect robots"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "numpy>=2.2,<3",
  "scipy>=1.15,<2",
  "torch==2.7.1",
  "torchrl==0.7.2",
  "tensordict==0.7.2",
  "mujoco==3.3.2",
  "warp-lang==1.7.2",
  "pillow>=11,<13",
]

[dependency-groups]
dev = [
  "mypy>=1.15,<2",
  "pytest>=8.3,<9",
  "ruff>=0.11,<1",
]

[project.scripts]
robot-ai = "robot_ai.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/robot_ai"]

[tool.uv]
default-groups = ["dev"]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }

[tool.pytest.ini_options]
addopts = ["--strict-markers", "--cache-clear", "--basetemp=.tmp/pytest"]
cache_dir = ".cache/pytest"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint.per-file-ignores]
# In a Warp kernel `float(0.0)` declares a mutable variable; a bare literal is a constant.
"src/robot_ai/sim/arm_batch.py" = ["UP018"]
"src/robot_ai/sim/joint_model.py" = ["UP018"]
"src/robot_ai/sim/chain_batch.py" = ["UP018"]
"src/robot_ai/sim/arm3d_batch.py" = ["UP018"]

[tool.mypy]
python_version = "3.12"
files = ["src/robot_ai"]
warn_unused_configs = true
disable_error_code = ["import-untyped"]
disallow_untyped_defs = true
check_untyped_defs = true
no_implicit_optional = true

[[tool.mypy.overrides]]
# Warp kernel signatures (`wp.array(dtype=...)`) are a DSL, not Python typing, and
# NumPy's stubs cannot express the structured-array fields that mirror Warp structs.
module = ["robot_ai.sim.arm_batch", "robot_ai.sim.joint_model", "robot_ai.sim.population", "robot_ai.sim.chain_batch", "robot_ai.sim.chain_env", "robot_ai.sim.arm3d_batch", "robot_ai.sim.arm3d_env"]
ignore_errors = true
